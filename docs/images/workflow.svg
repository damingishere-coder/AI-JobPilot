<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI JobPilot workflow</title>
  <desc id="desc">Resume and job preferences flow through browser-assisted collection, local AI analysis, manual confirmation, and application tracking.</desc>
  <rect width="1200" height="360" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="60" y="62" font-size="30" font-weight="800" fill="#0f172a">How AI JobPilot works</text>
    <text x="60" y="96" font-size="18" fill="#475569">登录状态留在你的浏览器，个人数据和任务记录保存在本机。</text>
    <g transform="translate(60 142)">
      <g>
        <rect width="190" height="136" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="36" cy="36" r="18" fill="#e0f2fe"/>
        <text x="30" y="43" font-size="18" font-weight="800" fill="#0369a1">1</text>
        <text x="24" y="80" font-size="21" font-weight="700" fill="#0f172a">配置求职目标</text>
        <text x="24" y="110" font-size="16" fill="#64748b">简历、城市、岗位、</text>
        <text x="24" y="132" font-size="16" fill="#64748b">薪资与黑名单</text>
      </g>
      <path d="M202 68 H238" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <path d="M230 58 L242 68 L230 78" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(252 0)">
        <rect width="190" height="136" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="36" cy="36" r="18" fill="#dbeafe"/>
        <text x="30" y="43" font-size="18" font-weight="800" fill="#1d4ed8">2</text>
        <text x="24" y="80" font-size="21" font-weight="700" fill="#0f172a">浏览器采集</text>
        <text x="24" y="110" font-size="16" fill="#64748b">复用已登录页面，</text>
        <text x="24" y="132" font-size="16" fill="#64748b">不绕过验证码</text>
      </g>
      <path d="M454 68 H490" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <path d="M482 58 L494 68 L482 78" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(504 0)">
        <rect width="190" height="136" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="36" cy="36" r="18" fill="#ede9fe"/>
        <text x="30" y="43" font-size="18" font-weight="800" fill="#6d28d9">3</text>
        <text x="24" y="80" font-size="21" font-weight="700" fill="#0f172a">AI 匹配分析</text>
        <text x="24" y="110" font-size="16" fill="#64748b">评分、筛选、理由与</text>
        <text x="24" y="132" font-size="16" fill="#64748b">失败诊断</text>
      </g>
      <path d="M706 68 H742" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <path d="M734 58 L746 68 L734 78" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(756 0)">
        <rect width="190" height="136" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="36" cy="36" r="18" fill="#fae8ff"/>
        <text x="30" y="43" font-size="18" font-weight="800" fill="#a21caf">4</text>
        <text x="24" y="80" font-size="21" font-weight="700" fill="#0f172a">人工确认投递</text>
        <text x="24" y="110" font-size="16" fill="#64748b">待确认队列，避免</text>
        <text x="24" y="132" font-size="16" fill="#64748b">默认自动发送</text>
      </g>
      <path d="M958 68 H994" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <path d="M986 58 L998 68 L986 78" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(1008 0)">
        <rect width="132" height="136" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="36" cy="36" r="18" fill="#dcfce7"/>
        <text x="30" y="43" font-size="18" font-weight="800" fill="#15803d">5</text>
        <text x="24" y="80" font-size="21" font-weight="700" fill="#0f172a">结果追踪</text>
        <text x="24" y="110" font-size="16" fill="#64748b">状态、统计</text>
        <text x="24" y="132" font-size="16" fill="#64748b">与失败原因</text>
      </g>
    </g>
  </g>
</svg>
