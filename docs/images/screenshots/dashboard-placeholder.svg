  <g font-family="Microsoft YaHei" font-size="16">
    <rect x="360" y="502" width="266" height="54" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="390" cy="529" r="11" fill="#22c55e"/><path d="m384 529 4 4 8-9" fill="none" stroke="#fff" stroke-width="3"/><text class="t" x="414" y="535">后端服务已连接</text>
    <rect x="644" y="502" width="266" height="54" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="674" cy="529" r="11" fill="#22c55e"/><path d="m668 529 4 4 8-9" fill="none" stroke="#fff" stroke-width="3"/><text class="t" x="698" y="535">AI 配置已保存</text>
    <rect x="928" y="502" width="266" height="54" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="958" cy="529" r="11" fill="#22c55e"/><path d="m952 529 4 4 8-9" fill="none" stroke="#fff" stroke-width="3"/><text class="t" x="982" y="535">简历档案已创建</text>
    <rect x="1212" y="502" width="286" height="54" rx="14" fill="#fff7ed" stroke="#fed7aa"/><circle cx="1242" cy="529" r="11" fill="#f59e0b"/><text x="1242" y="535" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">!</text><text class="t" x="1266" y="535">Chrome Bridge 待连接</text>
  </g>

  <rect class="card" x="328" y="610" width="586" height="274" rx="20" filter="url(#shadow)"/>
  <text class="t" x="360" y="652" font-size="23" font-weight="750">Boss 直聘</text><text class="muted tiny" x="360" y="680">岗位库状态与待处理任务</text>
  <g><rect x="360" y="716" width="158" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text class="muted tiny" x="382" y="746">待确认</text><text class="t num" x="382" y="802">12</text>
  <rect x="535" y="716" width="158" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text class="muted tiny" x="557" y="746">已投递</text><text class="t num" x="557" y="802">27</text>
  <rect x="710" y="716" width="158" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text class="muted tiny" x="732" y="746">失败</text><text class="t num" x="732" y="802">2</text></g>

  <rect class="card" x="944" y="610" width="586" height="274" rx="20" filter="url(#shadow)"/>
  <text class="t" x="976" y="652" font-size="23" font-weight="750">智联招聘</text><text class="muted tiny" x="976" y="680">岗位库状态与待处理任务</text>
  <g><rect x="976" y="716" width="158" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text class="muted tiny" x="998" y="746">待确认</text><text class="t num" x="998" y="802">6</text>
  <rect x="1151" y="716" width="158" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text class="muted tiny" x="1173" y="746">已投递</text><text class="t num" x="1173" y="802">15</text>
  <rect x="1326" y="716" width="158" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text class="muted tiny" x="1348" y="746">失败</text><text class="t num" x="1348" y="802">1</text></g>

  <rect x="1176" y="922" width="354" height="34" rx="17" fill="#0f172a" opacity=".86"/><text x="1353" y="944" text-anchor="middle" font-size="14" fill="#fff" font-family="Microsoft YaHei">占位示意图 · 回家后请替换为真实截图</text>
</svg>