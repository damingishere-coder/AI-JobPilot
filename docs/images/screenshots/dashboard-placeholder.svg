  <text class="t" x="360" y="196" font-size="23" font-weight="750">今日投递概览</text>
  <text class="muted tiny" x="360" y="224">最后刷新 14:36:08</text>
  <rect x="360" y="252" width="214" height="96" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="384" y="283" font-size="17" font-weight="700" fill="#0e7490" font-family="Microsoft YaHei">待确认</text><text class="t num" x="384" y="331">18</text>
  <rect x="592" y="252" width="214" height="96" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="616" y="283" font-size="17" font-weight="700" fill="#047857" font-family="Microsoft YaHei">已投递</text><text class="t num" x="616" y="331">42</text>
  <rect x="824" y="252" width="232" height="96" rx="16" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="848" y="283" font-size="17" font-weight="700" fill="#be123c" font-family="Microsoft YaHei">失败</text><text class="t num" x="848" y="331">3</text>

  <rect class="card" x="1112" y="154" width="418" height="226" rx="20" filter="url(#shadow)"/>
  <text class="t" x="1144" y="196" font-size="23" font-weight="750">快捷入口</text>
  <text class="muted tiny" x="1144" y="224">扫描、待确认和 AI 配置入口</text>
  <rect x="1144" y="246" width="354" height="44" rx="12" fill="#2563eb"/><text x="1321" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Microsoft YaHei">去 Boss 扫描</text>
  <rect x="1144" y="300" width="171" height="44" rx="12" fill="#fff" stroke="#cbd5e1"/><text class="t label" x="1229" y="328" text-anchor="middle">Boss 待确认</text>
  <rect x="1327" y="300" width="171" height="44" rx="12" fill="#fff" stroke="#cbd5e1"/><text class="t label" x="1412" y="328" text-anchor="middle">AI 配置</text>

