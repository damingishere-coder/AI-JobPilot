<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI JobPilot 投递工作台占位截图</title>
  <desc id="desc">依据前端代码绘制的投递工作台页面示意图，用于 README 临时展示。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <style>
      .t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.muted{fill:#64748b}.small{font-size:18px}.tiny{font-size:15px}.label{font-size:17px;font-weight:600}.title{font-size:34px;font-weight:800}.num{font-size:42px;font-weight:800}.card{fill:#fff;stroke:#dbe5f2;stroke-width:1.5}.nav{font-size:18px;font-weight:600}.section{font-size:14px;font-weight:700;letter-spacing:1.3px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
  <rect x="24" y="24" width="1552" height="952" rx="26" fill="#fff" stroke="#dce6f3" filter="url(#shadow)"/>
  <rect x="24" y="24" width="258" height="952" rx="26" fill="#fbfdff"/>
  <path d="M282 24v952" stroke="#e2e8f0"/>

  <rect x="54" y="58" width="50" height="50" rx="15" fill="url(#brand)"/>
  <text x="79" y="91" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" font-family="Microsoft YaHei">牛</text>
  <text class="t" x="120" y="78" font-size="24" font-weight="800">投递牛马</text>
  <text class="muted" x="120" y="104" font-size="15" font-family="Microsoft YaHei">AI JobPilot 工作台</text>
  <rect x="54" y="128" width="198" height="42" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
  <circle cx="76" cy="149" r="6" fill="#22c55e"/>
  <text class="t tiny" x="92" y="155">系统运行正常</text>

  <text class="section" x="58" y="214">工作台</text>
  <rect x="48" y="228" width="210" height="48" rx="12" fill="#eff6ff"/>
  <circle cx="75" cy="252" r="10" fill="#3b82f6" opacity=".16"/><path d="M69 252h12M75 246v12" stroke="#2563eb" stroke-width="2"/>
  <text class="t nav" x="98" y="259" fill="#2563eb">首页</text>
  <text class="section" x="58" y="318">求职资料</text>
  <text class="t nav" x="98" y="358">AI 配置</text>
  <text class="section" x="58" y="408">投递平台</text>
  <text class="t nav" x="98" y="448">Boss 直聘</text>
  <text class="t nav" x="98" y="494">智联招聘</text>
  <text class="section" x="58" y="544">投递记录</text>
  <text class="t nav" x="98" y="584">Boss 分析</text>
  <text class="t nav" x="98" y="630">智联分析</text>
  <text class="section" x="58" y="680">系统设置</text>
  <text class="t nav" x="98" y="720">环境配置</text>
  <rect x="54" y="902" width="198" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="muted tiny" x="74" y="929">v1.3.0 · 本地运行</text>

  <text class="t title" x="328" y="86">投递工作台</text>
  <text class="muted small" x="328" y="118">连接状态、待确认岗位与投递进度集中看板</text>
  <rect x="1418" y="62" width="112" height="44" rx="12" fill="#fff" stroke="#cbd5e1"/>
