<text class="t lb" x="360" y="378">上传简历</text><rect x="360" y="394" width="514" height="94" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="7 6"/><circle cx="410" cy="441" r="22" fill="#ede9fe"/><path d="M410 452v-24m-10 10 10-10 10 10" fill="none" stroke="#7c3aed" stroke-width="3"/><text class="t lb" x="450" y="433">2026_蒋金峰_AI产品运营简历.pdf</text><text class="m sm" x="450" y="460">解析完成 · 2.4 MB</text>
<text class="t lb" x="360" y="530">简历内容</text><rect x="360" y="546" width="514" height="184" rx="14" fill="#fff" stroke="#cbd5e1"/><text class="m" x="382" y="578" font-size="14">5 年知识管理与销售赋能经验，负责 AI 场景落地、</text><text class="m" x="382" y="605" font-size="14">知识结构化、RAG 标签治理、Prompt 与自动化提效……</text><text class="m" x="382" y="644" font-size="14">代表项目：合同商务知识精准推荐、AI 求职工作台、</text><text class="m" x="382" y="671" font-size="14">短视频自动切片与发布工作流……</text><text class="m" x="382" y="710" font-size="14">目标岗位：AI 产品运营 / AI 应用运营，城市：深圳。</text>
<text class="t lb" x="360" y="772">重点关注公司</text><rect x="360" y="788" width="514" height="64" rx="14" fill="#fff" stroke="#cbd5e1"/><text class="m sm" x="382" y="814">腾讯、字节跳动、华为云、金蝶、深信服</text><text class="m" x="382" y="838" font-size="13">每行一个公司，AI 分析时给予额外提示</text>
<rect class="card" x="930" y="266" width="600" height="610" rx="20" filter="url(#s)"/><text class="t sh" x="962" y="308">AI 匹配设置</text><text class="m sm" x="962" y="336">定义评分逻辑、岗位判断和打招呼方式</text>
<rect x="962" y="366" width="536" height="66" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/><text class="t lb" x="986" y="395">启用 AI 岗位分析</text><text class="m" x="986" y="418" font-size="13">岗位达到分数线后进入待确认列表</text><rect x="1430" y="382" width="50" height="28" rx="14" fill="#7c3aed"/><circle cx="1465" cy="396" r="11" fill="#fff"/>
<text class="t lb" x="962" y="474">AI 个人介绍</text><rect x="962" y="490" width="536" height="82" rx="14" fill="#fff" stroke="#cbd5e1"/><text class="m" x="984" y="520" font-size="14">我是具备 AI 场景落地与知识产品化经验的运营人员，</text><text class="m" x="984" y="546" font-size="14">擅长把业务流程拆解为可执行的 AI 工作流。</text>
<text class="t lb" x="962" y="614">匹配分析 Prompt</text><rect x="962" y="630" width="536" height="138" rx="14" fill="#fff" stroke="#cbd5e1"/><text class="m" x="984" y="660" font-size="14">请根据候选人简历和岗位描述，返回 score、decision、</text><text class="m" x="984" y="687" font-size="14">summary、strengths、risks 和 greeting。重点判断岗位</text><text class="m" x="984" y="714" font-size="14">是否属于 AI 产品运营、AI 应用运营或知识库运营方向。</text><text class="m" x="984" y="741" font-size="14">不要夸大经验，风险必须明确说明。</text>
<text class="t lb" x="962" y="810">默认打招呼文案</text><rect x="962" y="826" width="536" height="50" rx="14" fill="#fff" stroke="#cbd5e1"/><text class="m sm" x="984" y="857">您好，我有 AI 场景落地与知识运营经验，期待进一步沟通。</text>
