spring:
  application:
    name: toudi_niuma
  profiles:
    active: dev
  info:
    app:
      name: 投递牛马
      version: 0.0.1-SNAPSHOT
      description: Local 投递牛马 workspace
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./db/getjobs.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never  # 数据库文件已存在，不需要自动初始化
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4
    baseline-description: Existing Java schema baseline
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  output:
    ansi:
      enabled: always

# 服务器配置
server:
  port: ${SERVER_PORT:8888}  # 后端 API 固定端口

app:
  auto-open-browser: ${APP_AUTO_OPEN_BROWSER:true}
  paths:
    data-dir: ${APP_DATA_DIR:./data}
    output-dir: ${APP_OUTPUT_DIR:./output}
    cache-dir: ${APP_CACHE_DIR:./target/cache}
    log-dir: ${APP_LOG_DIR:./target/logs}
  browser:
    # Windows 示例：C:\Users\YourName\AppData\Local\AI-JobPilot\chrome-profile
    # macOS 示例：/Users/YourName/Library/Application Support/AI-JobPilot/chrome-profile
    user-data-dir: ${APP_BROWSER_USER_DATA_DIR:}
    # Windows 示例：C:\Program Files\Google\Chrome\Application\chrome.exe
    # macOS 示例：/Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    executable-path: ${APP_BROWSER_EXECUTABLE_PATH:}
    channel: ${APP_BROWSER_CHANNEL:}
    headless: ${APP_BROWSER_HEADLESS:false}
    slow-mo-ms: ${APP_BROWSER_SLOW_MO_MS:50}
  openclaw:
    command: ${APP_OPENCLAW_COMMAND:}
    profile: ${APP_OPENCLAW_PROFILE:openclaw}
    detail-limit: ${APP_OPENCLAW_DETAIL_LIMIT:5}

# 日志配置
logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  file:
    name: ${LOGGING_FILE_NAME:./target/logs/get-jobs.log}
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true  # 打开 MyBatis Plus 启动 banner
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
