name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    name: Browser Regression (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download built Next.js UI
        uses: actions/download-artifact@v4
        with:
          name: frontend-regression-build
          path: front/out
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install isolated Chromium
        shell: bash
        run: |
          # Hosted Windows runners intermittently reset downloads from the domestic mirror.
          # Override only this disposable CI checkout; retain the local wrapper configuration.
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew installRegressionBrowser -PwithBrowserDeps --no-daemon
      - name: Run offline browser regressions
        shell: bash
        run: ./gradlew browserRegressionTest --no-daemon
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ matrix.os }}
          path: |
            build/reports/tests/browserRegressionTest
            build/test-results/browserRegressionTest
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTNAME: ai-jobpilot-ci
      APP_AUTO_OPEN_BROWSER: "false"
      APP_BROWSER_HEADLESS: "true"
      APP_CACHE_DIR: /tmp/ai-jobpilot-ci/cache
      APP_DATA_DIR: /tmp/ai-jobpilot-ci/data
      APP_OUTPUT_DIR: /tmp/ai-jobpilot-ci/output
      LOGGING_FILE_NAME: /tmp/ai-jobpilot-ci/logs/get-jobs.log
      SPRING_DATASOURCE_URL: jdbc:sqlite:/tmp/ai-jobpilot-ci/getjobs-ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare CI directories and Gradle wrapper
        run: |
          mkdir -p "$APP_CACHE_DIR" "$APP_DATA_DIR" "$APP_OUTPUT_DIR" "$(dirname "$LOGGING_FILE_NAME")"
          chmod +x ./gradlew

      - name: Run backend tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Print failed JUnit reports
        if: failure()
        shell: bash
        run: |
          found_failure=false
          for report in build/test-results/test/*.xml; do
            if grep -Eq 'failures="[1-9]|errors="[1-9]' "$report"; then
              found_failure=true
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done
          if [[ "$found_failure" == "false" ]]; then
            echo "No failed JUnit XML report was found."
          fi

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Build backend
        run: ./gradlew build --no-daemon

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # The locked jsdom/undici test dependencies require Node >= 22.19.
          node-version: "24"
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        working-directory: front
        run: pnpm lint

      - name: Run frontend typecheck
        working-directory: front
        run: pnpm typecheck

      - name: Test frontend and Zhilian DOM contracts
        working-directory: front
        run: pnpm test

      - name: Build frontend
        working-directory: front
        run: pnpm build

      - name: Share built UI with browser regressions
        uses: actions/upload-artifact@v4
        with:
          name: frontend-regression-build
          path: front/out
          if-no-files-found: error
          retention-days: 7

  chrome-extension:
    name: Chrome Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate manifest and referenced files
        run: node scripts/validate-chrome-extension.mjs

      - name: Run Chrome extension contract tests
        run: node --test chrome-extension/tests/*.test.cjs

  docker-config:
    name: Docker Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Verify required Dockerfile stages
        shell: bash
        run: |
          for stage in backend-dev frontend-dev frontend-build backend-build runtime; do
            grep -Eq "^[[:space:]]*FROM[[:space:]].*[[:space:]]AS[[:space:]]${stage}([[:space:]]|$)" Dockerfile || {
              echo "Missing Dockerfile stage: ${stage}"
              exit 1
            }
          done
