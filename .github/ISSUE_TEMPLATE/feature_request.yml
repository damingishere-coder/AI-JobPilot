name: 功能建议
about: 提议新的求职辅助、平台适配或体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明用户问题和使用场景，而不只是技术实现。项目不会接受绕过验证码、登录验证、平台风控或取消人工确认的功能。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      placeholder: 每次扫描后都需要手动排除同一批不相关公司……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      placeholder: 在平台配置中增加可复用的公司排除规则……
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 求职配置
        - 岗位采集
        - AI 分析
        - 人工确认与投递
        - 结果统计
        - Chrome Bridge
        - 平台适配
        - Windows 启动与安装
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式
      placeholder: 当前只能……

  - type: textarea
    id: acceptance
    attributes:
      label: 完成标准
      placeholder: |
        - 用户可以……
        - 不会保存……
        - 投递前仍需……
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和 Roadmap。
          required: true
        - label: 该建议不会绕过平台验证、风控或投递限制。
          required: true
        - label: 涉及对外发送内容时，方案保留用户最终确认。
          required: true
